name: ShellCheck

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run ShellCheck
        # Excluded (documented false positives for this modular codebase):
        #   SC1091 - "not following sourced file" (informational; modular libs)
        #   SC2034 - "appears unused" (config keys used across sourced files)
        #   SC2153 - "ARCH may be misspelled" (ARCH set by detect module)
        run: |
          shellcheck -e SC1091,SC2034,SC2153 \
            install.sh uninstall.sh bin/android-linux \
            lib/*.sh profiles/*.sh tests/*.sh
