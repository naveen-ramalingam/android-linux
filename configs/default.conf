# AndroidLinux default configuration template.
# Copied to ~/.config/android-linux/config.conf on first run.
# Do not edit system-critical values by hand unless you know what you are doing.

# Base directory that contains the whole AndroidLinux installation.
LINUX_BASE=

# Path to the extracted Linux root filesystem (LINUX_BASE/rootfs).
LINUX_ROOT=

# Selected distribution: debian | debian-stable | ubuntu | alpine | archarm
DISTRO=debian

# Execution mode: chroot | proot | termux
INSTALL_MODE=

# SSH server port (22 often conflicts with Android; 2222 is the default).
SSH_PORT=2222

# Default Linux username created during setup (lowercase, digits, _ or -).
LINUX_USER=android

# Desktop environment: none | xfce | lxqt
DESKTOP=none

# VNC display port.
VNC_PORT=5901

# Bind VNC to localhost only (recommended). Set to 0 to expose VNC to the
# network (only do this on a trusted network).
VNC_LOCALHOST=1

# Start Linux automatically when entering the CLI: 0 | 1
AUTO_START=0

# DNS server used inside the Linux environment.
DNS=1.1.1.1

# Where backups are written.
BACKUP_DIR=

# PRoot only: bind Android shared storage (/sdcard, /storage) into the guest.
# OFF by default - a destructive command inside Linux could wipe Android files.
PROOT_BIND_STORAGE=0
